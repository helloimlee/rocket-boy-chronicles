<style>

<script type="application/json" id="cfg">{"slides":[{"t":"cover","dur":18.4,"nar":0},{"t":"act","act":1,"dur":3.8},{"t":"photo","act":1,"img":"PICT0003.jpg","anchor":true,"scene":"SCENE I","stitle":"The Initial Contact","text":"At precisely 2:14 PM, a highly aerodynamic, scale-model electric vehicle arrived in the lower quadrant of the living room carpet. It was unblemished. It was silent. It was, regrettably, still in the box.","nar":1,"dur":18.7},{"t":"photo","act":1,"img":"PICT0006.jpg","anchor":false,"caption":"FIG. 1 \u00b7 FIRST CONTACT, LOWER CARPET QUADRANT.","dur":3.0},{"t":"photo","act":1,"img":"PICT0032.jpg","anchor":false,"caption":"FIG. 2 \u00b7 THE VEHICLE, PHOTOGRAPHED FOR INSURANCE PURPOSES.","dur":3.0},{"t":"photo","act":1,"img":"PICT0031.jpg","anchor":false,"caption":"FIG. 3 \u00b7 PARALLEL PARKING, UNSUPERVISED.","dur":3.0},{"t":"photo","act":1,"img":"PICT0035.jpg","anchor":true,"scene":"SCENE II","stitle":"The Inspection","text":"The Chief Investigator, aged two, conducted a rigorous manual inspection of the vehicle's composite exterior. His diagnosis: functional. A secondary inspection, by mouth, was narrowly prevented.","nar":2,"dur":16.4},{"t":"photo","act":1,"img":"PICT0030.jpg","anchor":false,"caption":"FIG. 4 \u00b7 THE INVESTIGATOR CONSIDERS THE ACQUISITION.","dur":3.0},{"t":"photo","act":1,"img":"PICT0034.jpg","anchor":false,"caption":"FIG. 5 \u00b7 BACKUP IS REQUESTED, EMPHATICALLY.","dur":3.0},{"t":"photo","act":1,"img":"PICT0028.jpg","anchor":false,"caption":"FIG. 6 \u00b7 CONSULTATION WITH SENIOR MANAGEMENT.","dur":3.0},{"t":"photo","act":1,"img":"PICT0029.jpg","anchor":false,"caption":"FIG. 7 \u00b7 MANAGEMENT APPROVES, CONDITIONALLY.","dur":3.0},{"t":"photo","act":1,"img":"PICT0036.jpg","anchor":true,"scene":"SCENE III","stitle":"The Mechanical Assessment","text":"Protocol required a thorough examination of the drivetrain. The vehicle was inverted without its consent. No structural anomalies were recorded. The wheels, when spun, remained wheels.","nar":3,"dur":14.6},{"t":"photo","act":1,"img":"PICT0009.jpg","anchor":false,"caption":"FIG. 8 \u00b7 OVERNIGHT STORAGE, NORTHEAST CORNER.","dur":3.0},{"t":"act","act":2,"dur":3.8},{"t":"photo","act":2,"img":"PICT0033.jpg","anchor":true,"scene":"SCENE IV","stitle":"The Auxiliary Fleet Allocation","text":"To support the mission, an auxiliary logistics fleet of heavily modified plastic trucks was summoned from the toy chest repository. Several arrived upside down. Morale remained high.","nar":4,"dur":15.0},{"t":"photo","act":2,"img":"PICT0046.jpg","anchor":false,"caption":"FIG. 9 \u00b7 FLEET INTAKE, ONE UNIT AT A TIME.","dur":3.0},{"t":"photo","act":2,"img":"PICT0045.jpg","anchor":false,"caption":"FIG. 10 \u00b7 THE STAGING GROUND, MID-OPERATION.","dur":3.0},{"t":"photo","act":2,"img":"PICT0048.jpg","anchor":true,"scene":"SCENE V","stitle":"The Specialized Transport Audit","text":"Every asset was scrutinized. The heavy-utility vehicle was selected for off-carpet terrain capability, pending a full audit of its tires. The audit took most of the afternoon. The tires passed.","nar":5,"dur":15.5},{"t":"photo","act":2,"img":"PICT0047.jpg","anchor":false,"caption":"FIG. 11 \u00b7 THE AUDIT CONTINUES.","dur":3.0},{"t":"photo","act":2,"img":"PICT0049.jpg","anchor":false,"caption":"FIG. 12 \u00b7 THE AUDITOR, BRIEFLY AT REST.","dur":3.0},{"t":"photo","act":2,"img":"PICT0050.jpg","anchor":false,"caption":"FIG. 13 \u00b7 A FLOOR-LEVEL INSPECTION, CONDUCTED FACE FIRST.","dur":3.0},{"t":"photo","act":2,"img":"PICT0051.jpg","anchor":false,"caption":"FIG. 14 \u00b7 THE INSPECTION, ONGOING.","dur":3.0},{"t":"photo","act":2,"img":"PICT0012.jpg","anchor":true,"scene":"SCENE VI","stitle":"The Sentries","text":"The security detail, a local canine specialist in a floral neckerchief, observed the preparations with stoic neutrality. She had seen all of this before. She would see all of it again.","nar":6,"dur":14.3},{"t":"photo","act":2,"img":"PICT0014.jpg","anchor":false,"caption":"FIG. 15 \u00b7 PERIMETER PATROL, SOUTH LAWN.","dur":3.0},{"t":"photo","act":2,"img":"PICT0041.jpg","anchor":false,"caption":"FIG. 16 \u00b7 THE SPECIALIST DECLINES TO COMMENT.","dur":3.0},{"t":"photo","act":2,"img":"PICT0040.jpg","anchor":false,"caption":"FIG. 17 \u00b7 CREDENTIALS, PRESENTED ON REQUEST.","dur":3.0},{"t":"photo","act":2,"img":"PICT0013.jpg","anchor":false,"caption":"FIG. 18 \u00b7 THE SPECIALIST INSPECTS THE RECORDING DEVICE.","dur":3.0},{"t":"photo","act":2,"img":"PICT0026.jpg","anchor":false,"caption":"FIG. 19 \u00b7 AUXILIARY PLUSH PERSONNEL, RED SCARF DIVISION.","dur":3.0},{"t":"photo","act":2,"img":"PICT0025.jpg","anchor":false,"caption":"FIG. 20 \u00b7 THE SAME PERSONNEL, EVADING THE PRESS.","dur":3.0},{"t":"act","act":3,"dur":3.8},{"t":"photo","act":3,"img":"PICT0019.jpg","anchor":true,"scene":"SCENE VII","stitle":"High-Velocity Maneuvers","text":"The expedition commenced at a brisk, tactical crawl. Top speeds were achieved. Several corners were survived. The destination: the dining room baseboard, by way of everywhere else.","nar":7,"dur":15.5},{"t":"photo","act":3,"img":"PICT0052.jpg","anchor":false,"caption":"FIG. 21 \u00b7 THE INVESTIGATOR, AT CRUISING SPEED.","dur":3.0},{"t":"photo","act":3,"img":"PICT0008.jpg","anchor":false,"caption":"FIG. 22 \u00b7 A FIELD OFFICER HOLDS THE CORRIDOR.","dur":3.0},{"t":"photo","act":3,"img":"PICT0007.jpg","anchor":false,"caption":"FIG. 23 \u00b7 COMMAND SURVEYS THE ROUTE.","dur":3.0},{"t":"photo","act":3,"img":"PICT0058.jpg","anchor":true,"scene":"SCENE VIII","stitle":"The Domestic Obstacle","text":"A brief detour was required when the Chief Investigator engaged in a mandatory, highly confidential hiding sequence behind the drapery. His location was known to everyone in the building. Nobody said a word.","nar":8,"dur":17.8},{"t":"photo","act":3,"img":"PICT0059.jpg","anchor":false,"caption":"FIG. 24 \u00b7 THE INVESTIGATOR, DISCOVERED ON SCHEDULE.","dur":3.0},{"t":"photo","act":3,"img":"PICT0060.jpg","anchor":false,"caption":"FIG. 25 \u00b7 THE DEBRIEF, OUT OF FOCUS.","dur":3.0},{"t":"photo","act":3,"img":"PICT0010.jpg","anchor":true,"scene":"SCENE IX","stitle":"The Basecamp Summit","text":"By mid-afternoon, the transport had successfully climbed the sofa summit, overlooking the entire northern territory of the parlor. A flag was not planted. The moment was understood.","nar":9,"dur":16.0},{"t":"act","act":4,"dur":3.8},{"t":"photo","act":4,"img":"PICT0024.jpg","anchor":true,"scene":"SCENE X","stitle":"The Extended Committee","text":"The steering committee convened in the kitchen gallery to formalize the afternoon's itinerary, and to pass down operational command. Minutes were not taken. Snacks were.","nar":10,"dur":13.1},{"t":"photo","act":4,"img":"PICT0016.jpg","anchor":false,"caption":"FIG. 26 \u00b7 OPERATIONAL COMMAND CHANGES HANDS.","dur":3.0},{"t":"photo","act":4,"img":"PICT0017.jpg","anchor":false,"caption":"FIG. 27 \u00b7 THE HANDOVER, DOCUMENTED TWICE FOR ACCURACY.","dur":3.0},{"t":"photo","act":4,"img":"PICT0018.jpg","anchor":false,"caption":"FIG. 28 \u00b7 THE REMOTE IS STUDIED AT LENGTH.","dur":3.0},{"t":"photo","act":4,"img":"PICT0020.jpg","anchor":false,"caption":"FIG. 29 \u00b7 THE EAST CORRIDOR, SECURED.","dur":3.0},{"t":"photo","act":4,"img":"PICT0021.jpg","anchor":false,"caption":"FIG. 30 \u00b7 THE EAST CORRIDOR, SECURED AGAIN.","dur":3.0},{"t":"photo","act":4,"img":"PICT0037.jpg","anchor":false,"caption":"FIG. 31 \u00b7 A JUNIOR DELEGATE REVIEWS THE FOOTAGE.","dur":3.0},{"t":"photo","act":4,"img":"PICT0022.jpg","anchor":false,"caption":"FIG. 32 \u00b7 TWO OFFICIALS EXCHANGE INTELLIGENCE.","dur":3.0},{"t":"photo","act":4,"img":"PICT0023.jpg","anchor":false,"caption":"FIG. 33 \u00b7 THE STAIRWELL CAUCUS.","dur":3.0},{"t":"photo","act":4,"img":"PICT0015.jpg","anchor":false,"caption":"FIG. 34 \u00b7 A DELEGATE ARRIVES BY VERANDA.","dur":3.0},{"t":"photo","act":4,"img":"PICT0000.jpg","anchor":false,"caption":"FIG. 35 \u00b7 COMMITTEE MEMBER, FLORAL DIVISION.","dur":3.0},{"t":"photo","act":4,"img":"PICT0001.jpg","anchor":false,"caption":"FIG. 36 \u00b7 COMMITTEE MEMBER, THOROUGHLY AMUSED.","dur":3.0},{"t":"photo","act":4,"img":"PICT0002.jpg","anchor":false,"caption":"FIG. 37 \u00b7 COMMITTEE MEMBER, EXTREMELY PUNCTUAL.","dur":3.0},{"t":"photo","act":4,"img":"PICT0011.jpg","anchor":false,"caption":"FIG. 38 \u00b7 THE VERANDA SUBCOMMITTEE, IN SESSION.","dur":3.0},{"t":"photo","act":4,"img":"PICT0038.jpg","anchor":false,"caption":"FIG. 39 \u00b7 A SENIOR OFFICIAL, OFF DUTY.","dur":3.0},{"t":"photo","act":4,"img":"PICT0042.jpg","anchor":true,"scene":"SCENE XI","stitle":"The Commemorative Presentation","text":"To mark the success of the transit, a custom multi-colored artifact container was presented by the senior delegation. Its contents remain classified. Its wrapping paper did not survive.","nar":11,"dur":14.1},{"t":"photo","act":4,"img":"PICT0043.jpg","anchor":false,"caption":"FIG. 40 \u00b7 THE PRESENTATION, IN MOTION.","dur":3.0},{"t":"photo","act":4,"img":"PICT0044.jpg","anchor":false,"caption":"FIG. 41 \u00b7 A SECOND CONTAINER, HOT PINK, UNDISCLOSED.","dur":3.0},{"t":"photo","act":4,"img":"PICT0057.jpg","anchor":false,"caption":"FIG. 42 \u00b7 THE ARTIFACT, AS REMEMBERED.","dur":3.0},{"t":"photo","act":4,"img":"PICT0053.jpg","anchor":false,"caption":"FIG. 43 \u00b7 FIELD OPERATIONS RESUME, WITH COMMEMORATIVE STAMPS.","dur":3.0},{"t":"photo","act":4,"img":"PICT0054.jpg","anchor":false,"caption":"FIG. 44 \u00b7 THE STAMPS WERE NOT OPTIONAL.","dur":3.0},{"t":"photo","act":4,"img":"PICT0055.jpg","anchor":false,"caption":"FIG. 45 \u00b7 AN OFFICIAL PASSES THROUGH, DECORATED.","dur":3.0},{"t":"photo","act":4,"img":"PICT0056.jpg","anchor":false,"caption":"FIG. 46 \u00b7 THE GALLERY, AT SPEED.","dur":3.0},{"t":"photo","act":4,"img":"PICT0039.jpg","anchor":true,"scene":"SCENE XII","stitle":"The Quiet Conclusion","text":"At 4:45 PM, operations ceased. The fleet remained parked. The Director and the security detail reviewed the day in silence, as colleagues do. The house returned to its standard state of quiet symmetry.","nar":12,"dur":18.4},{"t":"end","dur":60,"nar":13}],"audio":{"0":"nar_00.mp3","1":"nar_01.mp3","2":"nar_02.mp3","3":"nar_03.mp3","4":"nar_04.mp3","5":"nar_05.mp3","6":"nar_06.mp3","7":"nar_07.mp3","8":"nar_08.mp3","9":"nar_09.mp3","10":"nar_10.mp3","11":"nar_11.mp3","12":"nar_12.mp3","13":"nar_13.mp3"},"acts":{"1":{"label":"ACT I","title":"The Discovery of the Luxury Transport","color":"#E9BBA4"},"2":{"label":"ACT II","title":"The Mobilization of the Supporting Fleet","color":"#D9A13B"},"3":{"label":"ACT III","title":"The Expedition Across the Living Room","color":"#46766F"},"4":{"label":"ACT IV","title":"The Gathering of the Syndicate","color":"#AE4A2E"}}}</script>
<script>

function setHud(s,i){
 var lbl='';
 if(s.t==='photo'||s.t==='act'){var a=CFG.acts[String(s.act)];lbl=a.label+' · '+a.title}
 if(s.t==='cover')lbl='Overture';
 if(s.t==='end')lbl='Curtain';
 document.getElementById('actlbl').textContent=lbl.toUpperCase();
 document.getElementById('cnt').textContent=(i+1)+' / '+S.length;
 document.getElementById('bar').style.width=(100*(i+1)/S.length)+'%';
}
function show(i){
 if(i<0)i=0; if(i>=S.length)i=S.length-1;
 var prev=stage.children[cur], next=stage.children[i], s=S[i];
 if(prev&&prev!==next)prev.classList.remove('active');
 cur=i;
 ensureLoaded(i-1,i+5);
 if(s.t==='photo'){
  next.style.setProperty('--kb',(s.dur+2)+'s');
  var im=next.querySelector('img.ph');
  im.style.animation='none'; void im.offsetWidth; im.style.animation='';
 }
 next.classList.add('active');
 next.classList.toggle('paused',paused);
 setHud(s,i);
 if(started){
  if(s.nar!=null&&!muted){player.src=CFG.audio[String(s.nar)];player.play().catch(function(){})}
  else{player.pause()}
 }
}
function schedule(){
 clearTimeout(timer);
 if(paused)return;
 var s=S[cur];
 if(s.t==='end')return;
 timer=setTimeout(function(){show(cur+1);schedule()},s.dur*1000);
}
function start(){
 started=true;
 document.getElementById('hud').classList.add('on');
 ensureLoaded(0,6);
 if(!muted){player.src=CFG.audio['0'];player.play().catch(function(){})}
 schedule();
 document.addEventListener('click',navClick);
}
function navClick(e){
 if(Date.now()-suppress<500)return;
 if(e.target.closest('.cbtn')||e.target.closest('.btn'))return;
 var x=e.clientX/window.innerWidth;
 if(x<0.25)go(-1); else if(x>0.75)go(1); else togglePause();
}
function go(d){clearTimeout(timer);show(cur+d);if(!paused)schedule()}
function togglePause(){
 paused=!paused;
 document.getElementById('pz').textContent=paused?'Play':'Pause';
 stage.children[cur].classList.toggle('paused',paused);
 if(paused){player.pause();clearTimeout(timer)}
 else{if(S[cur].nar!=null&&!muted)player.play().catch(function(){});schedule()}
}
function toggleMute(){
 muted=!muted;
 document.getElementById('mt').textContent=muted?'Sound On':'Sound Off';
 if(muted)player.pause();
 else if(S[cur].nar!=null&&started){player.play().catch(function(){})}
}
var tx=0,ty=0,tt=0;
document.addEventListener('touchstart',function(e){
 if(e.touches.length!==1)return;
 tx=e.touches[0].clientX;ty=e.touches[0].clientY;tt=Date.now();
},{passive:true});
document.addEventListener('touchend',function(e){
 if(!started)return;
 var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty, dt=Date.now()-tt;
 if(dt<800&&Math.abs(dx)>60&&Math.abs(dx)>1.5*Math.abs(dy)){
  suppress=Date.now();
  if(dx<0)go(1); else go(-1);
 }
},{passive:true});
document.addEventListener('keydown',function(e){
 if(!started)return;
 if(e.key==='ArrowRight')go(1);
 else if(e.key==='ArrowLeft')go(-1);
 else if(e.key===' '){e.preventDefault();togglePause()}
 else if(e.key==='m'||e.key==='M')toggleMute();
 else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});
build();
ensureLoaded(0,3);
show(0);
document.addEventListener('click',function(e){
 var ag=document.getElementById('again');
 if(ag&&e.target===ag){e.stopPropagation();player.pause();paused=false;
  document.getElementById('pz').textContent='Pause';show(0);schedule();
  if(!muted){player.src=CFG.audio['0'];player.play().catch(function(){})}}
});
document.getElementById('pz').addEventListener('click',togglePause);
document.getElementById('mt').addEventListener('click',toggleMute);
var fsb=document.getElementById('fs');
if(document.documentElement.requestFullscreen){
 fsb.addEventListener('click',function(){
  document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()});
}else{fsb.style.display='none'}
if('ontouchstart' in window){document.getElementById('hint').textContent='TAP SIDES TO NAVIGATE · CENTER TO PAUSE'}
</script>
</body>
</html>
